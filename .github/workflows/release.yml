name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-ref:
        description: Git release tag to build and publish (for example, v0.4.1)
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_REF: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-ref }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Check tag and package versions
        id: version
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          release_ref = os.environ["RELEASE_REF"]
          tag = release_ref.removeprefix("refs/tags/")
          if not tag.startswith("v"):
              raise SystemExit(f"release ref must be a v-prefixed tag, got {release_ref!r}")

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("rust/Cargo.toml").read_text())
          uv_lock = tomllib.loads(Path("uv.lock").read_text())
          cargo_lock = tomllib.loads(Path("rust/Cargo.lock").read_text())

          versions = {
              "pyproject.toml": pyproject["project"]["version"],
              "rust/Cargo.toml": cargo["workspace"]["package"]["version"],
          }
          versions["uv.lock"] = next(
              package["version"]
              for package in uv_lock["package"]
              if package["name"] == "genoio"
          )
          rust_packages = {"genoio-core", "genoio-io", "genoio-py"}
          versions.update(
              {
                  f"rust/Cargo.lock:{package['name']}": package["version"]
                  for package in cargo_lock["package"]
                  if package["name"] in rust_packages
              }
          )
          if len(versions) != 6:
              raise SystemExit(f"missing package version metadata: {versions}")

          expected = versions["pyproject.toml"]
          mismatches = {source: value for source, value in versions.items() if value != expected}
          if mismatches:
              raise SystemExit(f"package versions disagree: {versions}")
          if tag != f"v{expected}":
              raise SystemExit(f"tag {tag!r} does not match package version {expected!r}")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              print(f"version={expected}", file=output)
          print(f"validated genoio {expected} from {tag}")
          PY

  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: validate
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            manylinux: "2_28"
            artifact-name: wheel-linux-py3.11
          - os: ubuntu-latest
            python-version: "3.12"
            manylinux: "2_28"
            artifact-name: wheel-linux-py3.12
          - os: ubuntu-latest
            python-version: "3.13"
            manylinux: "2_28"
            artifact-name: wheel-linux-py3.13
          - os: ubuntu-latest
            python-version: "3.14"
            manylinux: "2_28"
            artifact-name: wheel-linux-py3.14
          - os: macos-latest
            python-version: "3.11"
            manylinux: "off"
            artifact-name: wheel-macos-py3.11
          - os: macos-latest
            python-version: "3.12"
            manylinux: "off"
            artifact-name: wheel-macos-py3.12
          - os: macos-latest
            python-version: "3.13"
            manylinux: "off"
            artifact-name: wheel-macos-py3.13
          - os: macos-latest
            python-version: "3.14"
            manylinux: "off"
            artifact-name: wheel-macos-py3.14
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.15.0
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --compatibility pypi -i python${{ matrix.python-version }} --out dist
          sccache: true

      - name: Install and smoke-test wheel
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv smoke-venv
          . smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python scripts/wheel_smoke.py
          python -c 'import os, genoio; assert genoio.__version__ == os.environ["EXPECTED_VERSION"]'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*

  sdist:
    name: Source distribution
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --locked --out dist

      - name: Install and import sdist
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          python -m venv smoke-venv
          . smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python -c 'import os, genoio; assert genoio.__version__ == os.environ["EXPECTED_VERSION"]'

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sdist
          path: dist/*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [validate, wheels, sdist]
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/genoio
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.2
