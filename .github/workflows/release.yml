name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wheels:
    name: Wheel (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            artifact-name: wheel-linux-py3.11
          - os: ubuntu-latest
            python-version: "3.12"
            artifact-name: wheel-linux-py3.12
          - os: ubuntu-latest
            python-version: "3.13"
            artifact-name: wheel-linux-py3.13
          - os: ubuntu-latest
            python-version: "3.14"
            artifact-name: wheel-linux-py3.14
          - os: macos-latest
            python-version: "3.11"
            artifact-name: wheel-macos-py3.11
          - os: macos-latest
            python-version: "3.12"
            artifact-name: wheel-macos-py3.12
          - os: macos-latest
            python-version: "3.13"
            artifact-name: wheel-macos-py3.13
          - os: macos-latest
            python-version: "3.14"
            artifact-name: wheel-macos-py3.14
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
          sccache: true

      - name: Install and smoke-test wheel
        shell: bash
        run: |
          python -m venv smoke-venv
          . smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python scripts/wheel_smoke.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Install and import sdist
        shell: bash
        run: |
          python -m venv smoke-venv
          . smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz
          python - <<'PY'
          import genoio

          print(f"imported genoio from {genoio.__file__}")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist]
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: read
      id-token: write

    environment:
      name: pypi
      url: https://pypi.org/p/genoio

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show distributions
        run: ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
