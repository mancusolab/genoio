name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python, Rust, and docs
    runs-on: macos-latest
    env:
      CC: clang
      AR: ar
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Verify
        run: make verify PYTHON=python ZENSICAL=zensical PYRIGHT=pyright PYTEST=pytest
