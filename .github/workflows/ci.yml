name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python, Rust, and docs
    runs-on: macos-latest
    env:
      CC: clang
      AR: ar
      RUSTDOCFLAGS: -Dwarnings
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Python dependencies
        run: python -m pip install -e ".[dev,docs]"

      - name: Build extension
        run: python -m maturin develop

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check

      - name: Lint Rust
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path rust/Cargo.toml --workspace

      - name: Build Rust docs
        run: cargo doc --manifest-path rust/Cargo.toml --workspace --no-deps

      - name: Type check Python
        run: pyright src tests scripts

      - name: Test Python
        run: pytest -q

      - name: Build docs
        run: mkdocs build --strict
