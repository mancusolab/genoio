[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "genoio"
version = "0.1.0"
description = "Genotype IO tools for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "maturin>=1.10,<2",
    "pre-commit>=3",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.5",
]
docs = [
    "hippogriffe>=0.2",
    "mkdocs>=1.6",
    "mkdocs-autorefs>=1.4",
    "mkdocs-include-exclude-files>=0.0.1",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.maturin]
python-source = "src"
module-name = "genoio._rust"
manifest-path = "rust/genoio-py/Cargo.toml"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["genoio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
