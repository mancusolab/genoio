[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "genoio"
version = "0.1.0"
description = "Genotype IO tools for Python"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Mancuso Lab" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "scipy>=1.10",
]

[project.urls]
Documentation = "https://mancusolab.github.io/genoio"
Homepage = "https://github.com/mancusolab/genoio"
Repository = "https://github.com/mancusolab/genoio"
Issues = "https://github.com/mancusolab/genoio/issues"

[project.optional-dependencies]
dev = [
    "maturin>=1.10,<2",
    "pre-commit>=3",
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.5",
]
docs = [
    "mkdocstrings-python>=1.12",
    "zensical>=0.0.37",
]

[tool.maturin]
python-source = "src"
module-name = "genoio._rust"
manifest-path = "rust/genoio-py/Cargo.toml"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["genoio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
