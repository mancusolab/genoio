[build-system]
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "genoio"
version = "0.4.0"
description = "Genotype IO tools for Python"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Mancuso Lab" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "scipy>=1.10",
]

[project.urls]
Documentation = "https://mancusolab.github.io/genoio"
Homepage = "https://github.com/mancusolab/genoio"
Repository = "https://github.com/mancusolab/genoio"
Issues = "https://github.com/mancusolab/genoio/issues"

[project.optional-dependencies]
dev = [
    "bgen>=1.9.10",
    "maturin>=1.10,<2",
    "pre-commit>=3",
    "pytest>=8",
    "ruff>=0.5",
    "ty>=0.0.44",
]
docs = [
    "mkdocstrings-python>=1.12",
    "zensical>=0.0.37",
]

[tool.maturin]
python-source = "src"
module-name = "genoio._rust"
manifest-path = "rust/genoio-py/Cargo.toml"
features = ["extension-module"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["genoio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ty.environment]
extra-paths = ["scripts"]
python-version = "3.11"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "bgen",
    "bgen_reader",
    "cbgen",
    "cyvcf2",
    "pandas_plink",
    "pgenlib",
]

[tool.ty.src]
include = ["src", "tests", "scripts"]
