[package]
name = "genoio-io"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# BGEN payloads are commonly zlib-compressed; zlib-ng keeps decompression off
# the pure-Rust miniz path for the main BGEN hot loop.
flate2 = { version = "1", default-features = false, features = ["zlib-ng-compat"] }
genoio-core = { path = "../genoio-core" }
noodles-bgzf = "0.47"
noodles-bcf = "0.86"
noodles-core = "0.20"
noodles-csi = "0.56"
noodles-tabix = "0.62"
noodles-vcf = "0.88"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
zstd = "0.13"

[dev-dependencies]
noodles-bgzf = "0.47"
tempfile = "3"

[lib]
path = "src/lib.rs"
